name: Organic Trace CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Native C11/C++20/ASM + Full-Stack Test Matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: organic
          POSTGRES_PASSWORD: organic
          POSTGRES_DB: organic_trace
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://organic:organic@localhost:5432/organic_trace?schema=public"
      JWT_SECRET: "ci_test_secret_key_for_automated_pipeline"
      PORT: "5000"
      BLOCKCHAIN_RPC_URL: "http://127.0.0.1:8545"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Workspace Dependencies
        run: |
          cd contracts && npm install --no-audit --no-fund
          cd ../backend && npm install --no-audit --no-fund
          cd ../frontend && npm install --no-audit --no-fund

      - name: Compile & Benchmark Native C11 / C++20 / Assembly Engine
        run: |
          make clean && make all && make benchmark

      - name: Static Syntax & Security Verification
        run: |
          node --check backend/src/index.js
          node --check backend/src/blockchain.js
          node --check backend/src/hash.js
          node --check backend/src/utils/dsaEngine.js
          node --check backend/src/services/schemeSyncService.js
          node --check backend/src/services/llmAssistantService.js

      - name: Push Prisma Schema & Seed PostgreSQL Database
        run: |
          cd backend
          npx prisma generate
          npx prisma db push --skip-generate
          node prisma/seed.js

      - name: Run Solidity Smart Contract Unit Tests
        run: npm run test:contracts

      - name: Run Backend Unit, DSA, Security, Integration & Load Tests
        run: npm run test:backend

      - name: Run Frontend Unit Tests & Production Build Check
        run: |
          npm run test:frontend
          cd frontend && npm run build

  docker-multiarch:
    name: Multi-Architecture Docker Buildx Check (AMD64 & ARM64)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Multi-Stage Container Image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: organic-trace:ci-amd64
